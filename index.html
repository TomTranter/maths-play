<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Number Garden</title>
  <meta name="description" content="Maths games for 5–7 year olds, following the Year 1 and Year 2 national curriculum.">
  <meta name="theme-color" content="#5fb8ec">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Number Garden">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preload" href="fonts/baloo2-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/scenery.css">
</head>
<body data-route="">
  <!-- Shared coin gradients (referenced by the Coin Shop). -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <radialGradient id="coin-cu" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#f3b07a"/><stop offset="1" stop-color="#b8662e"/></radialGradient>
      <radialGradient id="coin-ag" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#aab2bd"/></radialGradient>
    </defs>
  </svg>

  <div class="app" id="app">
    <i class="sun" aria-hidden="true"></i>
    <i class="hills" aria-hidden="true"></i>
    <div class="cloud" style="top:16%;width:120px;height:34px;animation-delay:-20s"></div>
    <div class="cloud" style="top:40%;width:90px;height:26px;animation-delay:-48s;animation-duration:90s"></div>

    <header class="bar">
      <div class="bar-side">
        <button class="round-btn" id="homeBtn" aria-label="Home" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5L12 4l9 7.5" fill="none" stroke="#1d3557" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.5 10v9.5h4.5v-5h4v5h4.5V10" fill="#ffd23f" stroke="#1d3557" stroke-width="2" stroke-linejoin="round"/></svg>
        </button>
        <div class="score" id="scoreBox" aria-label="Score">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.5L12 17.2l-5.9 3.2 1.3-6.5L2.5 9.3l6.6-.8z" fill="#ffd23f" stroke="#e0a800" stroke-width="1.5" stroke-linejoin="round"/></svg>
          <span id="score">0</span>
        </div>
      </div>
      <div class="controls" id="controls"></div>
      <button class="round-btn" id="soundBtn" aria-label="Sound on or off"></button>
    </header>

    <button class="instruction" id="say" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="#1d3557"/><path d="M16 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12" fill="none" stroke="#1d3557" stroke-width="2" stroke-linecap="round"/></svg>
      <span id="sayText"></span>
    </button>

    <main class="stage" id="stage"></main>
    <footer class="ground" id="ground"></footer>
  </div>

  <canvas id="fx"></canvas>

  <script src="js/core.js"></script>
  <!-- Home-screen order = load order. -->
  <script src="js/games/balloons.js"></script>
  <script src="js/games/blocks.js"></script>
  <script src="js/games/tenframe.js"></script>
  <script src="js/games/beads.js"></script>
  <script src="js/games/frog.js"></script>
  <script src="js/games/hundred.js"></script>
  <script src="js/games/coins.js"></script>
  <script src="js/games/clock.js"></script>
  <script src="js/games/shares.js"></script>
  <script src="js/games/bags.js"></script>
  <script src="js/games/balance.js"></script>
  <script src="js/games/shapes.js"></script>
  <script src="js/games/robot.js"></script>
  <script src="js/games/measure.js"></script>
  <script src="js/games/doubles.js"></script>
  <script src="js/games/farm.js"></script>
  <script src="js/games/pattern.js"></script>
  <script src="js/games/capacity.js"></script>
  <script src="js/games/croc.js"></script>
  <script src="js/games/cherry.js"></script>
  <script src="js/games/arrays.js"></script>
  <script src="js/games/calendar.js"></script>
  <script src="js/games/rocket.js"></script>
  <script src="js/games/cafe.js"></script>
  <script src="js/games/scales.js"></script>
  <script src="js/games/symmetry.js"></script>
  <script src="js/games/bear.js"></script>
  <script src="js/games/bubbles.js"></script>
  <script src="js/games/dice.js"></script>
  <script src="js/games/fractions.js"></script>
  <script src="js/games/machine.js"></script>
  <script src="js/games/myday.js"></script>
  <script src="js/games/race.js"></script>
  <script src="js/games/sorting.js"></script>
  <script src="js/games/tenbridge.js"></script>
  <script src="js/games/words.js"></script>
  <script src="js/fit.js"></script>
  <script src="js/main.js"></script>
  <script src="js/selftest.js"></script>
</body>
</html>
